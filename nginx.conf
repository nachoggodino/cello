server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Keep the app shell and PWA control files fresh so releases can update.
    location = / {
        try_files /index.html =404;
        add_header Cache-Control "no-cache";
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    location = /manifest.webmanifest {
        add_header Cache-Control "no-cache";
    }

    # SPA fallback - all unknown paths serve index.html so React Router works
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }

    # Long-lived cache only for Vite hashed build assets.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location /icons/ {
        add_header Cache-Control "public, max-age=2592000";
    }

    # Gzip for text-based assets
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
